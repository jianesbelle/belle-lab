<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>belle</title>
<meta name="description" content="음악 수업과 연구회 일을 담아 두는 곳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400&display=swap">
<style>
:root {
  --paper: #f7f5f0;
  --ink: #23211d;
  --soft: #8c877d;
  --line: #d9d4c8;
  --serif: "Gowun Batang", "Nanum Myeongjo", serif;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #171614; --ink: #ece8df; --soft: #8f8a80; --line: #34312c; }
}
:root[data-theme="dark"] { --paper: #171614; --ink: #ece8df; --soft: #8f8a80; --line: #34312c; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 300 15px/1.7 var(--sans);
  display: grid; grid-template-rows: auto 1fr auto;
  padding: 40px 16px;
}
.wrap { width: 100%; max-width: 520px; margin: 0 auto; }
.mark { font: 400 14px/1 var(--serif); letter-spacing: .3em; color: var(--soft); }
main { align-self: center; }
ul { list-style: none; margin: 0; padding: 0; }
li + li { margin-top: 64px; }
a { color: inherit; text-decoration: none; display: block; }
.word { font: 400 44px/1.2 var(--serif); letter-spacing: .02em; display: inline-block; position: relative; }
.word::after {
  content: ""; position: absolute; left: 0; bottom: -6px; height: 1px; width: 0;
  background: var(--ink); transition: width .6s cubic-bezier(.2,.7,.2,1);
}
a:hover .word::after, a:focus-visible .word::after { width: 100%; }
a:focus-visible { outline: none; }
.desc { margin-top: 14px; color: var(--soft); font-size: 14px; }
footer { font-size: 12px; color: var(--soft); letter-spacing: .08em; }
@media (prefers-reduced-motion: reduce) { .word::after { transition: none; } }
</style>
</head>
<body>
  <header class="wrap"><span class="mark">belle</span></header>
  <main class="wrap">
    <ul>
      <li><a href="sorigyeol/"><span class="word">음악</span><p class="desc">소리결 — 민요 창작 학습실</p></a></li>
      <li><a href="godssam-lounge/"><span class="word">연구회</span><p class="desc">갓쌤 라운지 — 연수 대기 화면</p></a></li>
    </ul>
  </main>
  <footer class="wrap">jianesbelle</footer>
</body>
</html>
